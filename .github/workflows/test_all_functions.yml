name: ITAM System Tests

on:
  push:
    branches: [ "main", "master", "GUI-interface" ]
  pull_request:
    branches: [ "main", "master", "GUI-interface" ]

jobs:
  test:
    runs-on: windows-latest  # Important: psutil and service checks need Windows for full compatibility

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Initialize Database
      run: |
        python create_db.py  # Ensures itam.db exists for the tests

    - name: Run All Functions Test
      run: |
        pytest tests/test_all.py